<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MISJA: ZDROWIE!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9A%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <header id="topbar" class="hidden">
    <button class="brand" id="btnHome" title="Menu główne">💚 <span>MISJA: ZDROWIE!</span></button>
    <div class="team" id="hdrTeam"></div>
    <div class="progress-wrap" title="Ukończone misje">
      <div class="progress"><div class="progress-fill" id="hdrBar"></div></div>
      <span id="hdrProg">0/8</span>
    </div>
    <div class="score" id="hdrScore" title="Punkty drużyny">⭐ 0</div>
    <div class="tools">
      <button class="icon-btn" id="btnVote" title="Głosowanie klasy (V)">🗳️</button>
      <button class="icon-btn" id="btnMap" title="Mapa (M)">🗺️</button>
      <button class="icon-btn" id="btnSound" title="Dźwięk (S)">🔊</button>
      <button class="icon-btn" id="btnFull" title="Pełny ekran (F)">⛶</button>
    </div>
  </header>

  <main id="screen"></main>

  <div id="overlay" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <noscript><p style="padding:2rem;font-size:1.5rem">Ta gra wymaga włączonego JavaScriptu w przeglądarce.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
